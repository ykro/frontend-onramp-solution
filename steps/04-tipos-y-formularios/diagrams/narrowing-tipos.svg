<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ts-title ts-desc">
  <title id="ts-title">Validación de texto de input con narrowing en TypeScript</title>
  <desc id="ts-desc">Un campo input siempre entrega un string. En lugar de forzar el tipo con as number, leerPrecioSeguro aplica trim(), convierte con Number() y verifica Number.isFinite() y mayor que 0 para devolver number o null.</desc>
  <defs>
    <marker id="ts-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563EB"/>
    </marker>
    <marker id="ts-arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#DC2626"/>
    </marker>
  </defs>

  <rect width="960" height="330" rx="12" fill="#F8F7F4"/>

  <text x="36" y="38" fill="#0F172A" font-size="17" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Paso 4: Convertir texto de &lt;input&gt; con narrowing sin usar as number</text>
  <text x="36" y="58" fill="#475569" font-size="12" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">event.target.value siempre es string. Valida en tiempo de ejecución antes de aceptar un monto.</text>

  <!-- Fila 1: Enfoque inseguro -->
  <rect x="36" y="80" width="888" height="72" rx="10" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.5"/>
  <rect x="52" y="96" width="168" height="22" rx="4" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
  <text x="136" y="111" fill="#B91C1C" font-size="10" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">INSEGURO: as number</text>
  <text x="52" y="138" fill="#7F1D1D" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Number("") -&gt; 0   |   Number("abc") -&gt; NaN   |   Number("-15") -&gt; -15  (pasan sin bloqueo)</text>

  <!-- Fila 2: Flujo con narrowing -->
  <rect x="36" y="172" width="888" height="132" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="52" y="186" width="218" height="22" rx="4" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="161" y="201" fill="#1D4ED8" font-size="10" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">SEGURO: leerPrecioSeguro(texto)</text>

  <!-- Paso A -->
  <rect x="52" y="222" width="150" height="62" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="127" y="246" fill="#0F172A" font-size="11" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">texto: string</text>
  <text x="127" y="266" fill="#475569" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">texto.trim()</text>

  <line x1="202" y1="253" x2="236" y2="253" stroke="#2563EB" stroke-width="1.8" marker-end="url(#ts-arrow)"/>

  <!-- Paso B -->
  <rect x="240" y="222" width="176" height="62" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="328" y="246" fill="#0F172A" font-size="11" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">limpio === ""</text>
  <text x="328" y="266" fill="#991B1B" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">si vacío -&gt; null</text>

  <line x1="416" y1="253" x2="450" y2="253" stroke="#2563EB" stroke-width="1.8" marker-end="url(#ts-arrow)"/>

  <!-- Paso C -->
  <rect x="454" y="222" width="218" height="62" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="563" y="246" fill="#0F172A" font-size="11" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">Number.isFinite(n) &amp;&amp; n &gt; 0</text>
  <text x="563" y="266" fill="#991B1B" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">si NaN / 0 / negativo -&gt; null</text>

  <line x1="672" y1="253" x2="706" y2="253" stroke="#2563EB" stroke-width="1.8" marker-end="url(#ts-arrow)"/>

  <!-- Paso D -->
  <rect x="710" y="222" width="196" height="62" rx="8" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5"/>
  <text x="808" y="246" fill="#166534" font-size="12" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">return numero</text>
  <text x="808" y="266" fill="#15803D" font-size="10" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" text-anchor="middle">Tipo verificado: number</text>
</svg>
