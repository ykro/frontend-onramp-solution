<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="css-title css-desc">
  <title id="css-title">CSS Grid de 2 columnas, Flexbox en acciones y foco visible</title>
  <desc id="css-desc">Esquema visual de tarjeta-reserva.css: CSS Grid de 2 columnas para los dos campos, Flexbox para alinear el botón y el mensaje de confirmación, y anillo de foco visible con :focus-visible al navegar con teclado.</desc>

  <rect width="960" height="340" rx="12" fill="#F8F7F4"/>

  <text x="36" y="38" fill="#0F172A" font-size="17" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Paso 2: Grid de 2 columnas, Flexbox y :focus-visible</text>
  <text x="36" y="58" fill="#475569" font-size="12" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Estructura visual de src/paso02-css-layout-y-foco/tarjeta-reserva.css.</text>

  <!-- Tarjeta simulada -->
  <rect x="36" y="80" width="560" height="232" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="56" y="108" fill="#0F172A" font-size="15" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Reservar sala de estudio</text>

  <!-- Zona Grid -->
  <rect x="56" y="122" width="520" height="92" rx="8" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="68" y="138" fill="#1D4ED8" font-size="10" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">.reserva-grid { display: grid; grid-template-columns: repeat(2, 1fr); }</text>

  <rect x="70" y="148" width="238" height="54" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.2"/>
  <text x="82" y="166" fill="#334155" font-size="11" font-weight="600" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Cantidad de personas</text>
  <text x="82" y="186" fill="#1D4ED8" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">4   (borde :focus-visible)</text>

  <rect x="324" y="148" width="238" height="54" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="336" y="166" fill="#334155" font-size="11" font-weight="600" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Horario</text>
  <text x="336" y="186" fill="#475569" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">15:00  v</text>

  <!-- Zona Flexbox -->
  <rect x="56" y="226" width="520" height="68" rx="8" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="68" y="242" fill="#166534" font-size="10" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">.reserva-acciones { display: flex; justify-content: space-between; }</text>

  <rect x="70" y="252" width="156" height="32" rx="6" fill="#1D4ED8"/>
  <text x="148" y="272" fill="#FFFFFF" font-size="11" font-weight="600" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" text-anchor="middle">Confirmar reserva</text>

  <rect x="266" y="252" width="296" height="32" rx="6" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1"/>
  <text x="414" y="272" fill="#166534" font-size="11" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" text-anchor="middle">Reserva confirmada para 4 personas...</text>

  <!-- Reglas explicadas -->
  <rect x="620" y="80" width="304" height="232" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="638" y="106" fill="#0F172A" font-size="13" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Las 3 reglas clave</text>
  <line x1="638" y1="116" x2="906" y2="116" stroke="#E2E8F0" stroke-width="1"/>

  <text x="638" y="142" fill="#1D4ED8" font-size="11" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">1. CSS Grid (2 columnas)</text>
  <text x="638" y="160" fill="#475569" font-size="11" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Coloca ambos campos lado a lado y</text>
  <text x="638" y="176" fill="#475569" font-size="11" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">colapsa a 1 columna en móvil (&lt;600px).</text>

  <text x="638" y="206" fill="#166534" font-size="11" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">2. CSS Flexbox (1 eje)</text>
  <text x="638" y="224" fill="#475569" font-size="11" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Alinea el botón y el mensaje de estado</text>
  <text x="638" y="240" fill="#475569" font-size="11" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">en una sola fila con espacio limpio.</text>

  <text x="638" y="270" fill="#0F172A" font-size="11" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">3. :focus-visible</text>
  <text x="638" y="288" fill="#475569" font-size="11" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Muestra un outline claro al moverte</text>
  <text x="638" y="304" fill="#475569" font-size="11" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">con Tab por inputs, select y botón.</text>
</svg>
