<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 350" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="imm-title imm-desc">
  <title id="imm-title">Estado mutable con push frente a actualización inmutable en React</title>
  <desc id="imm-desc">Comparación entre mutar un arreglo con push, que conserva la misma referencia en memoria y hace que Object.is devuelva true evitando que React redibuje, y crear un arreglo nuevo, que genera una referencia distinta para que React actualice la pantalla.</desc>
  <defs>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#DC2626"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#16A34A"/>
    </marker>
  </defs>

  <rect width="960" height="350" rx="12" fill="#F8F7F4"/>

  <text x="36" y="38" fill="#0F172A" font-size="17" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Paso 2: Por qué .push() congela React y un arreglo nuevo sí redibuja</text>
  <text x="36" y="58" fill="#475569" font-size="12" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">React decide si redibuja comparando la referencia anterior y la nueva con Object.is(prev, next).</text>

  <!-- Panel Izquierdo: Error (.push) -->
  <rect x="36" y="80" width="430" height="240" rx="10" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.5"/>
  <rect x="54" y="96" width="164" height="22" rx="4" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
  <text x="136" y="111" fill="#B91C1C" font-size="11" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">MUTACIÓN CON .push()</text>

  <rect x="54" y="132" width="394" height="44" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="66" y="151" fill="#0F172A" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">gastos.push(nuevo);</text>
  <text x="66" y="168" fill="#0F172A" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">setGastos(gastos);</text>

  <rect x="54" y="194" width="150" height="44" rx="6" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1"/>
  <text x="129" y="213" fill="#7F1D1D" font-size="11" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">ref #A1 (antes)</text>
  <text x="129" y="229" fill="#991B1B" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">[g-1, g-2, g-3, nuevo]</text>

  <line x1="204" y1="216" x2="292" y2="216" stroke="#DC2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="248" y="208" fill="#B91C1C" font-size="10" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">misma ref</text>

  <rect x="298" y="194" width="150" height="44" rx="6" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1"/>
  <text x="373" y="213" fill="#7F1D1D" font-size="11" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">ref #A1 (después)</text>
  <text x="373" y="229" fill="#991B1B" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">Object.is === true</text>

  <rect x="54" y="256" width="394" height="46" rx="6" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
  <text x="68" y="276" fill="#991B1B" font-size="12" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Resultado: React asume que nada cambió.</text>
  <text x="68" y="293" fill="#7F1D1D" font-size="11" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">La pantalla NO muestra el nuevo gasto ni recalcula el total.</text>

  <!-- Panel Derecho: Solución ([...prev, nuevo]) -->
  <rect x="494" y="80" width="430" height="240" rx="10" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1.5"/>
  <rect x="512" y="96" width="214" height="22" rx="4" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1"/>
  <text x="619" y="111" fill="#166534" font-size="11" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">UN ARREGLO NUEVO</text>

  <rect x="512" y="132" width="394" height="44" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="524" y="159" fill="#0F172A" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">setGastos( ¿cómo creas un arreglo nuevo? )</text>

  <rect x="512" y="194" width="150" height="44" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="587" y="213" fill="#334155" font-size="11" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">ref #A1 (prev)</text>
  <text x="587" y="229" fill="#475569" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">[g-1, g-2, g-3]</text>

  <line x1="662" y1="216" x2="750" y2="216" stroke="#16A34A" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="706" y="208" fill="#15803D" font-size="10" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">nueva ref</text>

  <rect x="756" y="194" width="150" height="44" rx="6" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1"/>
  <text x="831" y="213" fill="#166534" font-size="11" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">ref #B2 (nuevo)</text>
  <text x="831" y="229" fill="#15803D" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">Object.is === false</text>

  <rect x="512" y="256" width="394" height="46" rx="6" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1"/>
  <text x="526" y="276" fill="#166534" font-size="12" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Resultado: React detecta el cambio y redibuja.</text>
  <text x="526" y="293" fill="#15803D" font-size="11" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Aparece "Café rápido" y el total sube a Q305.00.</text>
</svg>
