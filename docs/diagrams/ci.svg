<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 265" width="920" height="265" role="img" aria-label="Flujo de Integración Continua (CI) en React y Next.js">
  <rect width="920" height="265" rx="12" fill="#F8F7F4" stroke="#E2E0D8" stroke-width="1.5"/>
  <text x="28" y="38" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="17" font-weight="700" fill="#1C1B19">Dónde entra la Integración Continua (CI) en el desarrollo de software</text>
  <text x="28" y="59" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" fill="#68645B">Cada git push dispara una máquina limpia en GitHub Actions que corre las mismas pruebas antes de integrar cambios.</text>

  <!-- Step 1: Local -->
  <rect x="28" y="84" width="182" height="148" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="28" y="84" width="182" height="30" rx="9" fill="#F2F0EA"/>
  <text x="42" y="104" font-family="Inter, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#1C1B19">1. Tu computadora</text>
  <text x="42" y="136" font-family="Inter, -apple-system, sans-serif" font-size="12" fill="#3D3B36">Editas código y pruebas</text>
  <text x="42" y="156" font-family="Inter, -apple-system, sans-serif" font-size="12" fill="#3D3B36">Corres tests en local</text>
  <rect x="40" y="176" width="158" height="24" rx="5" fill="#F2F0EA"/>
  <text x="50" y="192" font-family="JetBrains Mono, monospace" font-size="11" fill="#1C1B19">git commit + push</text>

  <!-- Arrow 1 -->
  <line x1="210" y1="158" x2="244" y2="158" stroke="#68645B" stroke-width="2"/>
  <polygon points="244,153 254,158 244,163" fill="#68645B"/>

  <!-- Step 2: GitHub Actions -->
  <rect x="254" y="84" width="212" height="148" rx="9" fill="#FFFFFF" stroke="#1E40AF" stroke-width="2"/>
  <rect x="254" y="84" width="212" height="30" rx="9" fill="#EBF0FE"/>
  <text x="268" y="104" font-family="Inter, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#1E40AF">2. GitHub Actions (CI)</text>
  <text x="268" y="136" font-family="Inter, -apple-system, sans-serif" font-size="12" fill="#3D3B36">Abre máquina Linux nueva</text>
  <text x="268" y="156" font-family="Inter, -apple-system, sans-serif" font-size="12" fill="#3D3B36">Clona tu repo desde cero</text>
  <text x="268" y="176" font-family="Inter, -apple-system, sans-serif" font-size="12" fill="#3D3B36">Instala versiones exactas</text>
  <text x="268" y="196" font-family="Inter, -apple-system, sans-serif" font-size="11.5" fill="#68645B">Sin caché ni archivos ocultos</text>

  <!-- Arrow 2 -->
  <line x1="466" y1="158" x2="500" y2="158" stroke="#68645B" stroke-width="2"/>
  <polygon points="500,153 510,158 500,163" fill="#68645B"/>

  <!-- Step 3: Checks -->
  <rect x="510" y="84" width="186" height="148" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="510" y="84" width="186" height="30" rx="9" fill="#F2F0EA"/>
  <text x="524" y="104" font-family="Inter, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#1C1B19">3. Verificaciones</text>
  <text x="524" y="136" font-family="Inter, -apple-system, sans-serif" font-size="12" fill="#3D3B36">Estilo y tipos (lint)</text>
  <text x="524" y="156" font-family="Inter, -apple-system, sans-serif" font-size="12" fill="#3D3B36">Pruebas automáticas</text>
  <rect x="520" y="176" width="166" height="24" rx="5" fill="#F2F0EA"/>
  <text x="528" y="192" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#1C1B19">npm ci &amp;&amp; npm run verify</text>

  <!-- Arrow 3 -->
  <line x1="696" y1="158" x2="730" y2="158" stroke="#68645B" stroke-width="2"/>
  <polygon points="730,153 740,158 730,163" fill="#68645B"/>

  <!-- Step 4: Verdict -->
  <rect x="740" y="84" width="152" height="68" rx="8" fill="#E7F4EA" stroke="#166534" stroke-width="1.5"/>
  <text x="754" y="108" font-family="Inter, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#166534">Verde (PASS)</text>
  <text x="754" y="128" font-family="Inter, -apple-system, sans-serif" font-size="11.5" fill="#14532D">Listo para revisar</text>
  <text x="754" y="143" font-family="Inter, -apple-system, sans-serif" font-size="11.5" fill="#14532D">o hacer merge</text>

  <rect x="740" y="164" width="152" height="68" rx="8" fill="#FDECEC" stroke="#991B1B" stroke-width="1.5"/>
  <text x="754" y="188" font-family="Inter, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#991B1B">Rojo (FAIL)</text>
  <text x="754" y="208" font-family="Inter, -apple-system, sans-serif" font-size="11.5" fill="#7F1D1D">Frena el merge y</text>
  <text x="754" y="223" font-family="Inter, -apple-system, sans-serif" font-size="11.5" fill="#7F1D1D">muestra el error</text>
</svg>
