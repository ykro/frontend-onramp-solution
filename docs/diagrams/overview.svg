<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 980 390" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="overview-title overview-desc">
  <title id="overview-title">Mapa del Onramp Frontend en 5 pasos independientes</title>
  <desc id="overview-desc">Cinco pasos independientes: Paso 1 HTML semántico y accesibilidad, Paso 2 CSS layout y foco, Paso 3 Estado inmutable y claves, Paso 4 Tipos y formularios en TypeScript, y Paso 5 Fetch, AbortController y frontera cliente/servidor, cada uno verificable por separado.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563EB"/>
    </marker>
    <marker id="arrow-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="980" height="390" rx="12" fill="#F8F7F4"/>

  <text x="32" y="38" fill="#0F172A" font-size="18" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Onramp Frontend — 5 pasos independientes</text>
  <text x="32" y="58" fill="#475569" font-size="12" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Puedes empezar directo por cualquier paso (por ejemplo, el Paso 3 o el Paso 5) y verificarlo por separado.</text>

  <!-- Fila 1: Paso 1, Paso 2, Paso 3 -->
  <rect x="32" y="78" width="286" height="106" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="46" y="90" width="64" height="20" rx="4" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="78" y="104" fill="#1D4ED8" font-size="10" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">PASO 1</text>
  <text x="120" y="105" fill="#0F172A" font-size="13" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">HTML y accesibilidad</text>
  <text x="46" y="128" fill="#475569" font-size="11" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Etiquetas semánticas, teclado y roles ByRole</text>
  <text x="46" y="146" fill="#475569" font-size="11" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">aria-invalid, aria-describedby y role="alert"</text>
  <text x="46" y="170" fill="#1D4ED8" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">npm run check:paso1 (CA-1.1, CA-1.2)</text>

  <line x1="318" y1="131" x2="344" y2="131" stroke="#2563EB" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="348" y="78" width="286" height="106" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="362" y="90" width="64" height="20" rx="4" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="394" y="104" fill="#1D4ED8" font-size="10" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">PASO 2</text>
  <text x="436" y="105" fill="#0F172A" font-size="13" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">CSS, layout y foco</text>
  <text x="362" y="128" fill="#475569" font-size="11" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">CSS Grid de 2 columnas en el formulario</text>
  <text x="362" y="146" fill="#475569" font-size="11" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Flexbox en acciones y borde :focus-visible</text>
  <text x="362" y="170" fill="#1D4ED8" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">npm run check:paso2 (CA-2.1)</text>

  <line x1="634" y1="131" x2="660" y2="131" stroke="#2563EB" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="664" y="78" width="284" height="106" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="678" y="90" width="64" height="20" rx="4" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="710" y="104" fill="#1D4ED8" font-size="10" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">PASO 3</text>
  <text x="752" y="105" fill="#0F172A" font-size="13" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Estado inmutable</text>
  <text x="678" y="128" fill="#475569" font-size="11" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">[...prev, nuevo] frente a .push() (Object.is)</text>
  <text x="678" y="146" fill="#475569" font-size="11" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">key={gasto.id} estable al filtrar listas</text>
  <text x="678" y="170" fill="#1D4ED8" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">npm run check:paso3 (CA-3.1, CA-3.2)</text>

  <!-- Fila 2: Paso 4, Paso 5 -->
  <rect x="148" y="200" width="320" height="106" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="162" y="212" width="64" height="20" rx="4" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="194" y="226" fill="#1D4ED8" font-size="10" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">PASO 4</text>
  <text x="236" y="227" fill="#0F172A" font-size="13" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Tipos y formularios</text>
  <text x="162" y="250" fill="#475569" font-size="11" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Convertir texto de &lt;input&gt; sin usar as number</text>
  <text x="162" y="268" fill="#475569" font-size="11" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Narrowing en TypeScript con Number.isFinite()</text>
  <text x="162" y="292" fill="#1D4ED8" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">npm run check:paso4 (CA-4.1)</text>

  <line x1="468" y1="253" x2="508" y2="253" stroke="#2563EB" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="512" y="200" width="320" height="106" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="526" y="212" width="64" height="20" rx="4" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="558" y="226" fill="#1D4ED8" font-size="10" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">PASO 5</text>
  <text x="600" y="227" fill="#0F172A" font-size="13" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Fetch y frontera</text>
  <text x="526" y="250" fill="#475569" font-size="11" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Revisar response.ok y cancelar con AbortController</text>
  <text x="526" y="268" fill="#475569" font-size="11" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Separar "use client" de secreto.server.ts</text>
  <text x="526" y="292" fill="#1D4ED8" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">npm run check:paso5 (CA-5.1 .. CA-5.3)</text>

  <!-- Barra de verificación -->
  <line x1="32" y1="324" x2="948" y2="324" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4,4"/>

  <rect x="32" y="338" width="286" height="36" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="175" y="361" fill="#0F172A" font-size="11" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">npm run dev (interfaz interactiva)</text>

  <line x1="318" y1="356" x2="344" y2="356" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow-muted)"/>

  <rect x="348" y="338" width="286" height="36" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="491" y="361" fill="#0F172A" font-size="11" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">npm run check (9 pruebas + tipos)</text>

  <line x1="634" y1="356" x2="660" y2="356" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow-muted)"/>

  <rect x="664" y="338" width="284" height="36" rx="6" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.2"/>
  <text x="806" y="361" fill="#166534" font-size="11" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">npm run build (listo para el curso)</text>
</svg>
