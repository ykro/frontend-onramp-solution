<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 940 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="firebase-title firebase-desc">
  <title id="firebase-title">Arquitectura de Firebase Auth y Firestore en una app frontend</title>
  <desc id="firebase-desc">El navegador inicia sesión en Firebase Auth y recibe un token Bearer. Con ese token consulta Firestore, que valida el acceso con firestore.rules y entrega documentos de colecciones mediante listeners en vivo.</desc>
  <defs>
    <marker id="fb-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563EB"/>
    </marker>
    <marker id="fb-arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#15803D"/>
    </marker>
  </defs>

  <rect width="940" height="360" rx="12" fill="#F8F7F4"/>

  <text x="32" y="38" fill="#0F172A" font-size="17" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Firebase Auth y Firestore desde el navegador</text>
  <text x="32" y="58" fill="#475569" font-size="12" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Cómo se conectan el inicio de sesión con token Bearer, las reglas de seguridad y las lecturas en vivo.</text>

  <!-- Navegador / Cliente React -->
  <rect x="32" y="88" width="236" height="236" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="46" y="102" width="120" height="20" rx="4" fill="#EFF6FF"/>
  <text x="106" y="116" fill="#1D4ED8" font-size="10" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">NAVEGADOR (REACT)</text>
  <text x="46" y="144" fill="#0F172A" font-size="13" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Componente "use client"</text>
  <text x="46" y="168" fill="#475569" font-size="11" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">1. Inicia sesión con correo o</text>
  <text x="46" y="184" fill="#475569" font-size="11" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">   proveedor (Google).</text>
  <text x="46" y="210" fill="#475569" font-size="11" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">2. Adjunta el ID Token en</text>
  <text x="46" y="226" fill="#1D4ED8" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Authorization: Bearer &lt;token&gt;</text>
  <text x="46" y="252" fill="#475569" font-size="11" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">3. Se suscribe a cambios con</text>
  <text x="46" y="268" fill="#15803D" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">onSnapshot(query, cb)</text>
  <text x="46" y="294" fill="#475569" font-size="11" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">4. Limpia el listener al</text>
  <text x="46" y="310" fill="#475569" font-size="11" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">   desmontar en useEffect.</text>

  <!-- Flecha 1: Cliente -> Firebase Auth -->
  <line x1="268" y1="136" x2="340" y2="136" stroke="#2563EB" stroke-width="1.8" marker-end="url(#fb-arrow)"/>
  <text x="304" y="128" fill="#1D4ED8" font-size="10" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" text-anchor="middle">Login</text>

  <!-- Flecha 2: Firebase Auth -> Cliente (Token Bearer) -->
  <line x1="344" y1="166" x2="272" y2="166" stroke="#15803D" stroke-width="1.8" marker-end="url(#fb-arrow-green)"/>
  <text x="308" y="182" fill="#15803D" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">ID Token</text>

  <!-- Firebase Auth -->
  <rect x="346" y="88" width="248" height="104" rx="10" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.5"/>
  <rect x="360" y="100" width="110" height="20" rx="4" fill="#EFF6FF"/>
  <text x="415" y="114" fill="#1D4ED8" font-size="10" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">FIREBASE AUTH</text>
  <text x="360" y="138" fill="#0F172A" font-size="12" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Identidad y sesión segura</text>
  <text x="360" y="158" fill="#475569" font-size="11" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Emite un JWT firmado con el uid</text>
  <text x="360" y="174" fill="#475569" font-size="11" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">del usuario (token Bearer).</text>

  <!-- Flecha 3: Cliente -> firestore.rules -->
  <line x1="268" y1="258" x2="340" y2="258" stroke="#2563EB" stroke-width="1.8" marker-end="url(#fb-arrow)"/>
  <text x="304" y="250" fill="#1D4ED8" font-size="10" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" text-anchor="middle">Consulta</text>

  <!-- firestore.rules -->
  <rect x="346" y="212" width="248" height="112" rx="10" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5"/>
  <rect x="360" y="224" width="124" height="20" rx="4" fill="#FEE2E2"/>
  <text x="422" y="238" fill="#B91C1C" font-size="10" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">FIRESTORE.RULES</text>
  <text x="360" y="262" fill="#0F172A" font-size="12" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Frontera de autorización</text>
  <text x="360" y="282" fill="#7F1D1D" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">allow read, write:</text>
  <text x="360" y="298" fill="#7F1D1D" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">  if request.auth.uid == uid;</text>
  <text x="360" y="314" fill="#475569" font-size="10" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Se evalúa en el servidor antes de leer.</text>

  <!-- Flecha 4: rules -> Firestore -->
  <line x1="594" y1="268" x2="650" y2="268" stroke="#15803D" stroke-width="1.8" marker-end="url(#fb-arrow-green)"/>

  <!-- Firestore -->
  <rect x="656" y="88" width="252" height="236" rx="10" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5"/>
  <rect x="670" y="102" width="96" height="20" rx="4" fill="#DCFCE7"/>
  <text x="718" y="116" fill="#15803D" font-size="10" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">FIRESTORE</text>
  <text x="670" y="144" fill="#0F172A" font-size="13" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Colecciones y documentos</text>

  <rect x="670" y="158" width="224" height="58" rx="6" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1"/>
  <text x="682" y="176" fill="#14532D" font-size="11" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">colección: gastos</text>
  <text x="682" y="194" fill="#475569" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">doc g-1: { concepto, monto, uid }</text>
  <text x="682" y="208" fill="#475569" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">doc g-2: { concepto, monto, uid }</text>

  <rect x="670" y="228" width="224" height="80" rx="6" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1"/>
  <text x="682" y="248" fill="#14532D" font-size="11" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Listeners en vivo</text>
  <text x="682" y="266" fill="#475569" font-size="11" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Cuando cambia un documento,</text>
  <text x="682" y="282" fill="#475569" font-size="11" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Firestore empuja la actualización</text>
  <text x="682" y="298" fill="#475569" font-size="11" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">sin recargar la página.</text>
</svg>
